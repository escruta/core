server:
  port: ${ESCRUTA_PORT:${PORT:8080}}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain,text/css,application/javascript
    min-response-size: 1024
spring:
  application:
    name: Escruta Core
  threads:
    virtual:
      enabled: ${ESCRUTA_VIRTUAL_THREADS:true}
  main:
    keep-alive: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  datasource:
    url: ${ESCRUTA_DB_URL:jdbc:mariadb://localhost:3306/escruta?rewriteBatchedStatements=true&cachePrepStmts=true&useServerPrepStmts=true}
    username: ${ESCRUTA_DB_USER:root}
    password: ${ESCRUTA_DB_PASSWORD:1234}
    hikari:
      initialization-fail-timeout: -1
      maximum-pool-size: ${ESCRUTA_DB_POOL_SIZE:15}
      minimum-idle: 5
      connection-timeout: 5000
      validation-timeout: 2000
      max-lifetime: 1800000
      data-source-properties:
        rewriteBatchedStatements: true
        cachePrepStmts: true
        useServerPrepStmts: true
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 120s
  cache:
    type: caffeine
  data:
    redis:
      host: ${ESCRUTA_KV_HOST:localhost}
      port: ${ESCRUTA_KV_PORT:6379}
      password: ${ESCRUTA_KV_PASSWORD:}
      timeout: 2s
      connect-timeout: 2s
  mail:
    host: ${ESCRUTA_MAIL_HOST:}
    port: ${ESCRUTA_MAIL_PORT:587}
    username: ${ESCRUTA_MAIL_USERNAME:}
    password: ${ESCRUTA_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${ESCRUTA_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${ESCRUTA_MAIL_SMTP_STARTTLS:true}
    from: ${ESCRUTA_MAIL_FROM:noreply@escruta.com}
  ai:
    openai:
      base-url: ${ESCRUTA_AI_BASE_URL:}
      api-key: ${ESCRUTA_AI_API_KEY:}
      chat:
        model: ${ESCRUTA_AI_MODEL:}
        temperature: 0.5
        reasoning-effort: low
    retry:
      exclude-on-http-codes: 429
logging:
  level:
    org.springframework.ai.retry.autoconfigure: ERROR
security:
  session:
    expiration-interval-seconds: ${ESCRUTA_SESSION_EXPIRATION_SECONDS:3600}
  auth-code:
    length: ${ESCRUTA_AUTH_CODE_LENGTH:6}
    ttl-seconds: ${ESCRUTA_AUTH_CODE_TTL_SECONDS:600}
    max-attempts: ${ESCRUTA_AUTH_CODE_MAX_ATTEMPTS:5}
    verification-token-ttl-seconds: ${ESCRUTA_AUTH_VERIFICATION_TOKEN_TTL_SECONDS:900}
  cors:
    allowedOrigins: ${ESCRUTA_CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowedHeaders: Authorization,Content-Type
    allowCredentials: true
services:
  mail:
    log-code: ${ESCRUTA_MAIL_LOG_CODE:true}
  helper:
    base-url: ${ESCRUTA_HELPER_URL:http://localhost:8000}
    api-key: ${ESCRUTA_HELPER_API_KEY:}
  source-uploads:
    dir: ${ESCRUTA_UPLOADS_DIR:${java.io.tmpdir}/escruta-uploads}
  jobs:
    max-concurrency: ${ESCRUTA_JOBS_MAX_CONCURRENCY:10}
  rate-limit:
    enabled: ${ESCRUTA_RATE_LIMIT_ENABLED:true}
    auth-requests-per-window: ${ESCRUTA_RATE_LIMIT_AUTH:10}
    chat-requests-per-window: ${ESCRUTA_RATE_LIMIT_CHAT:30}
    window-seconds: ${ESCRUTA_RATE_LIMIT_WINDOW:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: escruta-core
