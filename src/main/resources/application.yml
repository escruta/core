server:
  port: ${ESCRUTA_PORT:${PORT:8080}}
spring:
  application:
    name: Escruta Core
  web:
    resources:
      add-mappings: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true
  datasource:
    url: ${ESCRUTA_DB_URL:jdbc:mariadb://localhost:3306/escruta}
    username: ${ESCRUTA_DB_USER:root}
    password: ${ESCRUTA_DB_PASSWORD:1234}
    hikari:
      initialization-fail-timeout: -1
  sql:
    init:
      mode: never
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  data:
    redis:
      host: ${ESCRUTA_KV_HOST:localhost}
      port: ${ESCRUTA_KV_PORT:6379}
      password: ${ESCRUTA_KV_PASSWORD:}
  ai:
    openai:
      base-url: ${ESCRUTA_AI_BASE_URL:}
      api-key: ${ESCRUTA_AI_API_KEY:}
      chat:
        model: ${ESCRUTA_AI_MODEL:}
        temperature: 0.5
        reasoning-effort: low
      embedding:
        model: ${ESCRUTA_AI_EMBEDDING_MODEL:}
        base-url: ${ESCRUTA_AI_EMBEDDING_BASE_URL:${ESCRUTA_AI_BASE_URL:}}
        api-key: ${ESCRUTA_AI_EMBEDDING_API_KEY:${ESCRUTA_AI_API_KEY:}}
    vectorstore:
      qdrant:
        initialize-schema: true
        host: ${ESCRUTA_VDB_HOST:localhost}
        port: ${ESCRUTA_VDB_PORT:6334}
        api-key: ${ESCRUTA_VDB_API_KEY}
        collection-name: ${ESCRUTA_VDB_COLLECTION:escruta}
        use-tls: ${ESCRUTA_VDB_USE_TLS:false}
    retry:
      exclude-on-http-codes: 429
logging:
  level:
    org.springframework.ai.retry.autoconfigure: ERROR
security:
  session:
    expiration-interval-seconds: 3600
  cors:
    allowedOrigins: ${ESCRUTA_CORS_ALLOWED_ORIGINS:*}
    allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowedHeaders: Authorization,Content-Type
    allowCredentials: true
services:
  helper:
    base-url: ${ESCRUTA_HELPER_URL:http://localhost:8000}
    api-key: ${ESCRUTA_HELPER_API_KEY:}
